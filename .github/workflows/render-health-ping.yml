name: Render Health Ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Ping Render health endpoint
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repository variable is not set. Skipping ping."
            exit 0
          fi

          curl --fail --silent --show-error --max-time 20 --retry 2 "$RENDER_HEALTH_URL"
